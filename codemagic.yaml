workflows:
  android-workflow:
    name: MOLE Native Kotlin Compiler
    max_build_duration: 60
    instance_type: linux
    scripts:
      - name: Build Android Native APK
        script: |
          echo "Compiling native sensor modules on Linux framework..."
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
