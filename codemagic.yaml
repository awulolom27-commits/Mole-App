workflows:
  android-workflow:
    name: MOLE Native Kotlin Compiler
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Build Android Native APK
        script: |
          echo "Compiling native sensor modules..."
          # Generates a standard gradle wrapper on the cloud machine automatically
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
